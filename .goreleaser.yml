version: 2

project_name: korthex

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: korthex
    main: ./cmd/korthex
    binary: korthex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

brews:
  - repository:
      owner: mio
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/mio/korthex"
    description: "AI-native Kubernetes TUI tool - speak to your cluster, see everything"
    license: "Apache-2.0"
    install: |
      bin.install "korthex"
    test: |
      system "#{bin}/korthex", "--version"

release:
  prerelease: auto
  name_template: "v{{ .Version }}"
